name: V3 Daily Signal

on:
  schedule:
    # 兩段式第一段：台灣時間週一至週五 17:45（UTC 09:45），等 FinMind 當日收盤資料更新後再跑
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      # FinMind parquet 快取跨次執行保留，避免每次全量重抓撞 API 額度
      # 拆成 restore / save：即使選股步驟逾時或失敗，已抓到的資料也會存起來，下次就快了
      - name: Restore FinMind cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/finmind
          key: finmind-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            finmind-${{ runner.os }}-

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          # 庫存以 Google Sheets「Positions」分頁為準（CI 上沒有本機 positions.json）
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 35
        run: uv run python -u main.py

      - name: Save FinMind cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/finmind
          key: finmind-${{ runner.os }}-${{ github.run_id }}

