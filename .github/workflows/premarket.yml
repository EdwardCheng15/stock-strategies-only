name: Premarket Night Session

on:
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  run-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: uv sync

      # FinMind parquet 快取跨次執行保留，避免每次全量重抓撞 API 額度
      - name: Restore FinMind cache
        uses: actions/cache@v4
        with:
          path: .cache/finmind
          key: finmind-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            finmind-${{ runner.os }}-

      - name: Run premarket report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          # 庫存以 Google Sheets「Positions」分頁為準（CI 上沒有本機 positions.json）
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
        run: uv run python premarket.py
